<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · TreeXiv</title>
<link rel="stylesheet" href="/site.css">
</head>
<body>
<div class="page">
  <header class="top">
    <a class="wordmark" href="/">TreeXiv</a>
    <nav><a href="/">About</a><a href="/example">Example</a></nav>
  </header>

  <main>
    <h1>Sign in</h1>
    <form class="auth" id="form">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button type="submit" id="submit">Sign in</button>
      <div class="msg" id="msg" role="status"></div>
    </form>
    <p class="muted small">No account? TreeXiv is invite-only: open the invite link
      you were sent to create one.</p>
  </main>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

  // Render's free tier sleeps when idle; while it wakes, requests fail with a
  // 404 or 5xx. Retry those for a while rather than calling it an error.
  async function post(path, body) {
    var deadline = Date.now() + 90000;
    while (true) {
      var res = null;
      try {
        res = await fetch(path, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
      } catch (e) {}
      var transient = !res || [404, 502, 503, 504].indexOf(res.status) !== -1;
      if (transient && Date.now() < deadline) {
        $("msg").className = "msg";
        $("msg").textContent = "Waking the server, up to a minute…";
        await sleep(3000);
        continue;
      }
      if (!res) throw new Error("Can't reach the server.");
      var data = {};
      try { data = await res.json(); } catch (e) {}
      var detail = data.detail;
      if (Array.isArray(detail)) detail = detail.map(function (d) { return d.msg; }).join("; ");
      if (!res.ok) throw new Error(detail || (res.status + " " + res.statusText));
      return data;
    }
  }

  $("form").addEventListener("submit", async function (e) {
    e.preventDefault();
    $("submit").disabled = true;
    $("msg").className = "msg";
    $("msg").textContent = "Signing in…";
    try {
      await post("/auth/login", { email: $("email").value, password: $("password").value });
      window.location.href = "/app";
    } catch (err) {
      $("msg").className = "msg err";
      $("msg").textContent = err.message;
      $("submit").disabled = false;
    }
  });
})();
</script>
</body>
</html>
