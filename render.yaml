# Render Blueprint — TreeXiv web front-end (free tier).
# Docs: https://render.com/docs/blueprint-spec
#
# The landing page and /example are public; running the pipeline needs an
# invite-only account (see src/treexiv/webauth.py). Set the `sync: false`
# vars when Render prompts during Blueprint creation:
#   OPENALEX_API_KEY   — your OpenAlex key
#   OPENALEX_MAILTO    — your email (OpenAlex polite-pool header)
#   DATABASE_URL       — a Postgres connection string for the accounts tables
#   OPENROUTER_API_KEY — curation and the Step 0 "identify paper" feature.
#       Leave blank and runs fall back to the keyword filter (and that one
#       route returns 501).
# TREEXIV_SESSION_SECRET is generated; changing it signs everyone out.

services:
  - name: treexiv
    type: web
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: "uv sync --frozen --no-dev --extra web"
    startCommand: "uv run --no-sync uvicorn treexiv.web:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    # Deploys come from .github/workflows/ci.yml (tests first, then the
    # service's deploy hook), not from Render watching the branch.
    autoDeployTrigger: "off"
    envVars:
      - key: UV_VERSION
        value: "0.11.24"
      - key: OPENALEX_API_KEY
        sync: false
      - key: OPENALEX_MAILTO
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TREEXIV_SESSION_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: "z-ai/glm-5.3-flash"
      - key: TREEXIV_TOTAL_CORPUS_CAP
        value: "400"
      - key: TREEXIV_FANOUT_CAP
        value: "60"
      - key: TREEXIV_BM25_TOP_K
        value: "40"
