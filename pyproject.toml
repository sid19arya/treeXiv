[project]
name = "treexiv"
version = "0.1.0"
description = "Trace a paper's citation lineage as an interactive graph, from a Claude Code skill or the CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "rank-bm25>=0.2.2",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/sid19arya/treeXiv"

[project.scripts]
treexiv = "treexiv.cli:entry_point"

# Optional: the private web front-end deployed to Render (see README "Deploy").
# Deliberately not a core dependency — the Phase 0 CLI/skill never import these.
[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/treexiv"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=treexiv --cov-report=term-missing"
